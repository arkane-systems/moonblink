moonraker:
  url: ws://127.0.0.1:7125/websocket
  rest_url: http://127.0.0.1:7125

api:
  bind_address: 127.0.0.1
  port: 8765

brightness_max: 0.35
update_rate_hz: 15
flash_duration_ms: 300
critical_alert_escalate_after_s: 30

colors:
  printing: [0, 255, 0]
  idle: [0, 0, 255]
  paused: [255, 255, 0]
  error: [255, 0, 0]
  warning: [255, 160, 0]
  critical: [255, 0, 0]

temp_thresholds:
  warning_c: 5
  critical_c: 15

night_mode:
  enabled: false
  dim_to: 0.1
  start: "22:00"
  end: "07:00"

